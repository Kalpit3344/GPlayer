name: CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

env:
  NODE_VERSION: '22'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm test -- --runInBand

  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;27.1.12297006"

      - name: Build Android release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Android release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            android/app/build/outputs/apk/release/
            android/app/build/outputs/bundle/release/

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS Release (No Code Signing)
        if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/')
        run: |
          xcodebuild -workspace ios/GPlayer.xcworkspace \
            -scheme GPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build iOS Release (With Code Signing)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          xcodebuild -workspace ios/GPlayer.xcworkspace \
            -scheme GPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create IPA
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_DIR="ios/build/Build/Products/Release-iphoneos/GPlayer.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: iOS app not found at expected path: $APP_DIR"
            echo "Available build products:"
            find ios/build -maxdepth 6 -type d -name "*.app" || true
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r GPlayer.ipa Payload/

      - name: Upload iOS artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: GPlayer.ipa

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: android-build

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-artifacts
          path: ios-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android-build/apk/release/app-release.apk
            android-build/bundle/release/app-release.aab
            ios-build/GPlayer.ipa
          body: |
            ## 🎉 GPlayer Release ${{ github.ref_name }}
            
            ### 📦 Artifacts
            - **Android APK**: app-release.apk
            - **Android AAB**: app-release.aab
            - **iOS IPA**: GPlayer.ipa
            
            ### ✅ Build Status
            - ✅ Linting passed
            - ✅ Tests passed
            - ✅ Android build successful
            - ✅ iOS build successful
          draft: false
          prerelease: false
